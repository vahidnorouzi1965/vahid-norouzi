<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>پیام خانواده</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#0b1220;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}
.app{min-height:100vh;max-width:520px;margin:auto;padding:20px 16px 28px}
h1{text-align:center;margin:8px 0 4px;font-size:27px}.sub{text-align:center;color:#aeb8c8;font-size:14px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button{border:0;border-radius:22px;min-height:145px;color:#fff;font-size:18px;font-weight:700;box-shadow:0 7px 18px #0005;cursor:pointer}
button:active{transform:scale(.97)}
.num{font-size:14px;opacity:.85;display:block;margin-bottom:8px}.code{font-size:14px;opacity:.8;display:block;margin-top:8px;direction:ltr}
.b1{background:#2878d8}.b2{background:#2b9b72}.b3{background:#8b5bd6}.b4{background:#d07b27}.b5{background:#bd4f68}.b6{background:#555f72}
.phone{margin:18px 0 10px;padding:13px;border-radius:16px;background:#172235;text-align:center;color:#dbe4f2;direction:ltr}
.note{text-align:center;color:#9eabc0;font-size:12px;line-height:1.8}
</style>
</head>
<body>
<main class="app">
<h1>پیام خانواده</h1>
<div class="sub">برای ارسال فرمان، دکمه موردنظر را لمس کنید</div>
<section class="grid">
<button class="b1" onclick="send('APO')"><span class="num">۱</span>🚗 هر دو درب پارکینگ باز<span class="code">APO</span></button>
<button class="b2" onclick="send('P1O')"><span class="num">۲</span>🏠 درِ پارکینگ حیاط باز<span class="code">P1O</span></button>
<button class="b3" onclick="send('P2O')"><span class="num">۳</span>🚗 درِ پارکینگ دوم باز<span class="code">P2O</span></button>
<button class="b4" onclick="send('MDO')"><span class="num">۴</span>🌳 درِ حیاط باز<span class="code">MDO</span></button>
<button class="b5" onclick="send('UDO')"><span class="num">۵</span>🚪 درِ آپارتمان باز<span class="code">UDO</span></button>
<button class="b6" onclick="send('3301=1')"><span class="num">۶</span>🔒 دزدگیر روشن<span class="code">3301=1</span></button>
</section>
<div class="phone">09332325018</div>
<div class="note">پس از لمس دکمه، برنامه پیامک آیفون باز می‌شود.<br>شماره و متن آماده هستند؛ فقط «Send» را تأیید کنید.</div>
</main>
<script>
const phone="09332325018";
function send(code){
  window.location.href="sms:"+phone+"?body="+encodeURIComponent(code);
}
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
